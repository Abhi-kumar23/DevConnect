services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command:
      [ 
        "mongosh",
        "--host",
        "mongodb:27017",
        "--eval",
        "try { rs.status() } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }",
      ]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/devconnect?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost,http://127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_SOCKET_URL: http://localhost:8000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "80:4173"
    depends_on:
      - server

volumes:
  mongodb_data:
  redis_data: