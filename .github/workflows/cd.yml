name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "SERVER_IMAGE=${REGISTRY}/${owner}/devconnect-server" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${REGISTRY}/${owner}/devconnect-web" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web (node)
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:main
          build-args: |
            build-args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
              VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
              VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "SERVER_IMAGE=${REGISTRY}/${owner}/devconnect-server" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${REGISTRY}/${owner}/devconnect-web" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export IMAGE_TAG="${{ github.sha }}"
            export SERVER_IMAGE="${{ env.SERVER_IMAGE }}"
            export WEB_IMAGE="${{ env.WEB_IMAGE }}"
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GHCR_DEPLOY_TOKEN }}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull web server
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build web server
